<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b2340" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧳</text></svg>"
    />
    <title>バックおんバックス</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="game" aria-label="バックおんバックス ゲーム画面" role="img"></canvas>
    </div>
    <!-- ランキングのなまえ入力(src/nameDialog.js が出し入れする) -->
    <div id="name-dialog" class="name-dialog" hidden>
      <form class="name-panel" role="dialog" aria-modal="true" aria-labelledby="name-title" aria-describedby="name-note">
        <h2 id="name-title">ランキングの なまえ</h2>
        <input
          id="name-input"
          type="text"
          maxlength="10"
          required
          autocomplete="off"
          spellcheck="false"
          enterkeyhint="done"
          aria-labelledby="name-title"
        />
        <p id="name-note">10文字まで。ログインは いりません（この端末が おぼえておきます）</p>
        <div class="name-buttons">
          <button type="button" data-cancel>やめる</button>
          <button type="submit">きめる</button>
        </div>
      </form>
    </div>
    <noscript>このゲームを遊ぶには JavaScript を有効にしてください。</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
